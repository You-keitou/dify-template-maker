          \    const replyToken = data.events[0].replyToken;\n    const userId = data.events[0].source.userId;\n\
          \n    // グループチャットかどうかを判断\n    let groupId = null;\n    if (data.events[0].source.type\
          \ === \"group\") {\n    groupId = data.events[0].source.groupId;\n    }\n\
          \n    // 後続処理のために必要な情報を渡す\n    return {\n        message: userMessage,\n\
          \        replyToken: replyToken,\n        userId: userId,\n        groupId:\
          \ groupId,\n        sourceType: data.events[0].source.type\n    };\n}\n"
